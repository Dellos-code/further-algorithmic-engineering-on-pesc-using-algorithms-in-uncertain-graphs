name: fusion

on:
  push:
    paths:
      - "w1-dual-operator-rank-fusion/fusion/**"
      - "w1-dual-operator-rank-fusion/tests/test_fusion.py"
      - ".github/workflows/fusion.yml"
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r w1-dual-operator-rank-fusion/requirements.txt
      - run: python w1-dual-operator-rank-fusion/tests/test_fusion.py
